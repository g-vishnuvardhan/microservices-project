apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-service
  namespace: microservices-lab
  labels:
    app: frontend-service
    tier: frontend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
        tier: frontend
    spec:
      containers:
        - name: frontend-service
          image: cloudmart-frontend:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: PRODUCT_SERVICE_URL
            - name: ORDER_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: ORDER_SERVICE_URL
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: APP_ENV
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: microservices-lab
  labels:
    app: frontend-service
spec:
  type: NodePort
  selector:
    app: frontend-service
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
      name: http
