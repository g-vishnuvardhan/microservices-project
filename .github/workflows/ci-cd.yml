name: Automated Microservices CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  lint-and-test:
    name: Code Quality & Syntax Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Lint Python Microservices
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          # Check for syntax errors or undefined names
          flake8 services/ --count --select=E9,F63,F7,F82 --show-source --statistics

  docker-build:
    name: Container Image Build Verification
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Product Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/product-service
          push: false
          tags: cloudmart-product:test

      - name: Build Order Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/order-service
          push: false
          tags: cloudmart-order:test

      - name: Build Frontend Service Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/frontend
          push: false
          tags: cloudmart-frontend:test

  k8s-manifest-validation:
    name: Kubernetes Manifest Validation (Dry Run)
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Validate Kubernetes Manifests
        run: |
          echo "Running client-side dry-run validation of all manifests..."
          kubectl apply --dry-run=client -k k8s/
