apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: microservices-lab
  labels:
    app: order-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
        tier: backend
    spec:
      containers:
        - name: order-service
          image: cloudmart-order:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
              name: http
          env:
            - name: PORT
              value: "5002"
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: DB_NAME
            - name: PRODUCT_SERVICE_URL
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: PRODUCT_SERVICE_URL
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: cloudmart-secrets
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cloudmart-secrets
                  key: DB_PASSWORD
            - name: APP_ENV
              valueFrom:
                configMapKeyRef:
                  name: cloudmart-config
                  key: APP_ENV
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5002
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5002
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: microservices-lab
  labels:
    app: order-service
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - port: 5002
      targetPort: 5002
      name: http
