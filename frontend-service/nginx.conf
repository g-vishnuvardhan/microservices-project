server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy to user-service
    location /api/users {
        proxy_pass http://user-service:8081/users;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Reverse proxy to product-service
    location /api/products {
        proxy_pass http://product-service:8082/products;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Reverse proxy to user-service actuator health
    location /api/health/users {
        proxy_pass http://user-service:8081/actuator/health;
        proxy_set_header Host $host;
    }

    # Reverse proxy to product-service actuator health
    location /api/health/products {
        proxy_pass http://product-service:8082/actuator/health;
        proxy_set_header Host $host;
    }
}
