apiVersion: v1
kind: Secret
metadata:
  name: cloudmart-secrets
  namespace: microservices-lab
type: Opaque
stringData:
  DB_USER: "postgres"
  DB_PASSWORD: "postgres123"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudmart-config
  namespace: microservices-lab
data:
  DB_HOST: "postgres-service"
  DB_PORT: "5432"
  DB_NAME: "cloudmart"
  PRODUCT_SERVICE_URL: "http://product-service:5001"
  ORDER_SERVICE_URL: "http://order-service:5002"
  APP_ENV: "kubernetes-production"
