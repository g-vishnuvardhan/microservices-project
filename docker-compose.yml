name: cloudmart
services:
  postgres-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cloudmart
      POSTGRES_USER: cloudmart
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
    volumes: ["db-data:/var/lib/postgresql/data"]
    networks: [app-network]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudmart -d cloudmart"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  product-service:
    build: ./services/product-service
    image: cloudmart-product:v1
    networks: [app-network]
    restart: unless-stopped
  order-service:
    build: ./services/order-service
    image: cloudmart-order:v1
    environment:
      DB_HOST: postgres-db
      DB_NAME: cloudmart
      DB_USER: cloudmart
      DB_PASSWORD: ${DB_PASSWORD}
      PRODUCT_SERVICE_URL: http://product-service:5001
      ENABLE_LOAD_DEMO: "true"
    depends_on:
      postgres-db: {condition: service_healthy}
      product-service: {condition: service_healthy}
    networks: [app-network]
    restart: unless-stopped
  frontend-service:
    build: ./services/frontend
    image: cloudmart-frontend:v1
    ports: ["127.0.0.1:5000:5000"]
    environment:
      PRODUCT_SERVICE_URL: http://product-service:5001
      ORDER_SERVICE_URL: http://order-service:5002
      DEPLOYMENT_MODE: docker-compose
    depends_on:
      product-service: {condition: service_healthy}
      order-service: {condition: service_healthy}
    networks: [app-network]
    restart: unless-stopped
networks:
  app-network: {}
volumes:
  db-data: {}
