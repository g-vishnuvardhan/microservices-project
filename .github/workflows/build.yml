name: Automated Microservices Deployment CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-microservices:
    name: Build & Test Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build User Service
        working-directory: user-service
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Build Product Service
        working-directory: product-service
        run: |
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

  build-and-push-docker:
    name: Build & Push Docker Images to GHCR
    runs-on: ubuntu-latest
    needs: build-microservices

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Convert repo owner to lowercase
        run: echo "OWNER_LC=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push User Service Image
        uses: docker/build-push-action@v6
        with:
          context: ./user-service
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/user-service:latest
            ghcr.io/${{ env.OWNER_LC }}/user-service:${{ github.sha }}

      - name: Build and Push Product Service Image
        uses: docker/build-push-action@v6
        with:
          context: ./product-service
          push: true
          tags: |
            ghcr.io/${{ env.OWNER_LC }}/product-service:latest
            ghcr.io/${{ env.OWNER_LC }}/product-service:${{ github.sha }}

  deploy-and-verify:
    name: Deploy & Verify on Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push-docker

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Kind Kubernetes Cluster
        uses: helm/kind-action@v1.10.0
        with:
          cluster_name: microservices-cluster
          wait: 120s

      - name: Configure Image Pull Secrets for GHCR
        run: |
          kubectl create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --docker-email=ci@github.com
          kubectl patch serviceaccount default -p '{"imagePullSecrets": [{"name": "ghcr-secret"}]}'

      - name: Validate Kubernetes Manifests (Dry Run)
        run: |
          kubectl apply --dry-run=client -f k8s/

      - name: Deploy Microservices to Kubernetes
        run: |
          kubectl apply -f k8s/

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/user-service --timeout=180s
          kubectl rollout status deployment/product-service --timeout=180s

      - name: Inspect Cluster State
        run: |
          kubectl get pods -o wide
          kubectl get svc -o wide
          kubectl get hpa
          kubectl get ingress
